name: Build PyroRealism 0.2.0

'on':
  workflow_dispatch:
  push:
    paths:
      - 'PyroRealism-1.21.1-Fire-Smoke-0.2.0-SOURCE.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          ZIP_FILE="PyroRealism-1.21.1-Fire-Smoke-0.2.0-SOURCE.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_FILE"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.source.outputs.zip }}" -d extracted

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          BUILD_FILE="$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/build/*' -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::No Gradle build file found in ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Compile mod
        run: gradle -p "${{ steps.project.outputs.dir }}" clean build --no-daemon --stacktrace

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: PyroRealism-1.21.1-Fire-Smoke-0.2.0
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
